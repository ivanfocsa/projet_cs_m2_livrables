<!-- Logs applicatifs CRM/RDV/dossiers patients. -->
<localfile>
  <log_format>json</log_format>
  <location>/var/ossec/logs/daylight/application_events.jsonl</location>
</localfile>

<!-- Logs messagerie simules. -->
<localfile>
  <log_format>json</log_format>
  <location>/var/ossec/logs/daylight/mail_events.jsonl</location>
</localfile>

<!-- Logs Active Directory simules. -->
<localfile>
  <log_format>json</log_format>
  <location>/var/ossec/logs/daylight/ad_events.jsonl</location>
</localfile>

<!-- Logs endpoint simules si aucun poste Windows reel n'est disponible. -->
<localfile>
  <log_format>json</log_format>
  <location>/var/ossec/logs/daylight/endpoint_events.jsonl</location>
</localfile>

<!-- Logs firewall pfSense simules au format syslog. -->
<localfile>
  <log_format>syslog</log_format>
  <location>/var/ossec/logs/daylight/firewall_syslog.log</location>
</localfile>

