<!--
  Snippet a integrer dans /var/ossec/etc/ossec.conf cote Wazuh Manager.
  Adapter les chemins si les logs sont montes ailleurs dans le conteneur/VM.
-->

<!-- Reception syslog pour pfSense FW-S01/FW-S02. -->
<remote>
  <connection>syslog</connection>
  <port>514</port>
  <protocol>udp</protocol>
  <allowed-ips>10.10.1.1/32</allowed-ips>
  <allowed-ips>10.10.2.1/32</allowed-ips>
</remote>

